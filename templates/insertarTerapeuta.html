{% extends "base.html" %}

{% block title %}Registrar Terapeuta - Gestión Clínica{% endblock %}

{% block content %}
<div class="contenedor">
    <h1>Registrar Nuevo Terapeuta</h1>
    <form action="{{ url_for('registra_terapeuta') }}" method="POST" style="margin-top: 1.5rem;">
        <div class="grupo-form">
            <label for="correo">Correo Electrónico (Usuario):</label>
            <input id="correo" type="email" name="correo" required>
        </div>
        <div class="grupo-form">
            <label for="password_hash">Contraseña:</label>
            <input id="password_hash" type="password" name="password_hash" required minlength="5">
        </div>
        <div class="grupo-form">
            <label for="nombres">Nombres:</label>
            <input id="nombres" type="text" name="nombres" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_paterno">Apellido Paterno:</label>
            <input id="apellido_paterno" type="text" name="apellido_paterno" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_materno">Apellido Materno:</label>
            <input id="apellido_materno" type="text" name="apellido_materno">
        </div>
        <div class="grupo-form">
            <label for="cedula_profesional">Cédula Profesional:</label>
            <input id="cedula_profesional" type="text" name="cedula_profesional" required>
        </div>
        <button type="submit" class="btn btn-primario">Guardar Terapeuta</button>
        <a href="{{ url_for('terapeutas') }}" class="btn" style="background-color: #e2e8f0; color: #334155; margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
