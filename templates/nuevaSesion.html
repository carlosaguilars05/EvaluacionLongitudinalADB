{% extends "base.html" %}

{% block title %}Agendar Sesión - Gestión Clínica{% endblock %}

{% block content %}
<div class="contenedor">
    <h1>Programar Nueva Sesión</h1>
    <form action="{{ url_for('registra_sesion') }}" method="POST" style="margin-top: 1.5rem;">
        <div class="grupo-form">
            <label for="id_asignacion">Vínculo Clínico (Terapeuta - Paciente):</label>
            <select id="id_asignacion" name="id_asignacion" required>
                <option value="" disabled selected>-- Seleccione la asignación activa --</option>
                {% for a in Asignaciones %}
                <option value="{{ a[0] }}">{{ a[1] }} (atiende a) {{ a[2] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grupo-form">
            <label for="id_modalidad">Modalidad:</label>
            <select id="id_modalidad" name="id_modalidad" required>
                <option value="" disabled selected>-- Seleccione la modalidad --</option>
                {% for m in Modalidades %}
                <option value="{{ m[0] }}">{{ m[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="fila-form">
            <div class="grupo-form">
                <label for="fecha">Fecha de la Sesión:</label>
                <input id="fecha" type="date" name="fecha" required>
            </div>
            <div class="grupo-form">
                <label for="hora_inicio">Hora de Inicio:</label>
                <input id="hora_inicio" type="time" name="hora_inicio" required>
            </div>
            <div class="grupo-form">
                <label for="hora_fin">Hora de Fin:</label>
                <input id="hora_fin" type="time" name="hora_fin" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primario" style="margin-top: 1rem;">Guardar Sesión</button>
        <a href="{{ url_for('sesiones') }}" class="btn" style="background-color: #e2e8f0; color: #334155; margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
