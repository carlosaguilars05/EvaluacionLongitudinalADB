{% extends "base.html" %}

{% block title %}Registrar Paciente - Gestión Clínica{% endblock %}

{% block content %}
<div class="contenedor">
    <h1>Registrar Nuevo Paciente</h1>
    <form action="{{ url_for('registra') }}" method="POST" style="margin-top: 1.5rem;">
        <div class="grupo-form">
            <label for="correo">Correo Electrónico (Usuario):</label>
            <input id="correo" type="email" name="correo" required>
        </div>
        <div class="grupo-form">
            <label for="password_hash">Contraseña:</label>
            <input id="password_hash" type="password" name="password_hash" required minlength="5">
        </div>
        <div class="grupo-form">
            <label for="nombres">Nombres:</label>
            <input id="nombres" type="text" name="nombres" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_paterno">Apellido Paterno:</label>
            <input id="apellido_paterno" type="text" name="apellido_paterno" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_materno">Apellido Materno:</label>
            <input id="apellido_materno" type="text" name="apellido_materno">
        </div>
        <div class="grupo-form">
            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input id="fecha_nacimiento" type="date" name="fecha_nacimiento" required>
        </div>
        <div class="grupo-form">
            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo" required>
                <option value="Femenino">Femenino</option>
                <option value="Masculino">Masculino</option>
            </select>
        </div>
        <div class="grupo-form">
            <label for="telefono">Teléfono:</label>
            <input id="telefono" type="text" name="telefono">
        </div>
        <button type="submit" class="btn btn-primario">Guardar Paciente</button>
        <a href="{{ url_for('pacientes') }}" class="btn" style="background-color: #e2e8f0; color: #334155; margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
