{% extends "base.html" %}

{% block title %}Nueva Asignación - Gestión Clínica{% endblock %}

{% block content %}
<div class="contenedor">
    <h1>Vincular Terapeuta a Paciente</h1>
    <form action="{{ url_for('registra_asignacion') }}" method="POST" style="margin-top: 1.5rem;">
        <div class="grupo-form">
            <label for="id_terapeuta">Seleccionar Terapeuta:</label>
            <select id="id_terapeuta" name="id_terapeuta" required>
                <option value="" disabled selected>-- Elija un profesional --</option>
                {% for t in Terapeutas %}
                <option value="{{ t[0] }}">{{ t[1] }} {{ t[2] }} (Cédula: {{ t[4] }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="grupo-form">
            <label for="id_paciente">Seleccionar Paciente (solo pacientes activos sin asignar):</label>
            <select id="id_paciente" name="id_paciente" required>
                <option value="" disabled selected>-- Elija un paciente libre --</option>
                {% for p in Pacientes %}
                {# Contrato sp_listar_pacientes_sin_asignar: (0: id_paciente, 1: nombre_completo) #}
                <option value="{{ p[0] }}">{{ p[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primario" style="margin-top: 1rem;">Confirmar Vinculación</button>
        <a href="{{ url_for('asignaciones') }}" class="btn" style="background-color: #e2e8f0; color: #334155; margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
