{% extends "base.html" %}

{% block title %}Actualizar Paciente - Gestión Clínica{% endblock %}

{% block content %}
<div class="contenedor">
    <h1>Editar Datos del Paciente</h1>
    <form action="{{ url_for('actualizar') }}" method="POST" style="margin-top: 1.5rem;">
        <input type="hidden" name="id_paciente" value="{{ Paciente[0] }}">

        <div class="grupo-form">
            <label for="nombres">Nombres:</label>
            <input id="nombres" type="text" name="nombres" value="{{ Paciente[1] }}" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_paterno">Apellido Paterno:</label>
            <input id="apellido_paterno" type="text" name="apellido_paterno" value="{{ Paciente[2] }}" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_materno">Apellido Materno:</label>
            <input id="apellido_materno" type="text" name="apellido_materno" value="{{ Paciente[3] or '' }}">
        </div>
        <div class="grupo-form">
            <label for="telefono">Teléfono:</label>
            <input id="telefono" type="text" name="telefono" value="{{ Paciente[6] or '' }}">
        </div>
        <button type="submit" class="btn btn-primario">Actualizar Cambios</button>
        <a href="{{ url_for('pacientes') }}" class="btn" style="background-color: #e2e8f0; color: #334155; margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
