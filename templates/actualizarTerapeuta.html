<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Terapeuta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <nav>
        <h2>Sistema de Gestión Clínica</h2>
        <div>
            <!-- Solo el Admin (rol 1) ve el catálogo global -->
            {% if session.get('usuario_rol') == 1 %}
                <a href="{{ url_for('principal') }}">Inicio</a>
                <a href="{{ url_for('pacientes') }}">Pacientes</a>
                <a href="{{ url_for('terapeutas') }}">Terapeutas</a>
                <a href="{{ url_for('asignaciones') }}">Asignaciones</a>
            {% endif %}

            <!-- Solo el Terapeuta (rol 2) ve a sus propios pacientes -->
            {% if session.get('usuario_rol') == 2 %}
                <a href="{{ url_for('mis_pacientes') }}">Mis Pacientes</a>
            {% endif %}

            <!-- Todos (Admin, Terapeuta y Paciente) ven la Agenda -->
            <a href="{{ url_for('sesiones') }}">Agenda</a>
            
            <!-- Botón de Salir para todos -->
            <a href="{{ url_for('logout') }}" style="background-color: #ef4444; color: white; padding: 0.3rem 0.8rem; border-radius: 4px; margin-left: 1rem;">Salir</a>
        </div>
    </nav>

    <div class="contenedor">
        <h1>Editar Datos del Terapeuta</h1>
        <form action="{{ url_for('actualizar_terapeuta') }}" method="POST" style="margin-top: 1.5rem;">
            <input type="hidden" name="id_terapeuta" value="{{ Terapeuta[0] }}">

            <div class="grupo-form">
                <label>Nombres:</label>
                <input type="text" name="nombres" value="{{ Terapeuta[1] }}" required>
            </div>
            <div class="grupo-form">
                <label>Apellido Paterno:</label>
                <input type="text" name="apellido_paterno" value="{{ Terapeuta[2] }}" required>
            </div>
            <div class="grupo-form">
                <label>Apellido Materno:</label>
                <input type="text" name="apellido_materno" value="{{ Terapeuta[3] or '' }}">
            </div>
            <div class="grupo-form">
                <label>Cédula Profesional:</label>
                <input type="text" name="cedula_profesional" value="{{ Terapeuta[4] }}" required>
            </div>
            <button type="submit" class="btn btn-primario">Actualizar Cambios</button>
        </form>
    </div>
</body>
</html>
