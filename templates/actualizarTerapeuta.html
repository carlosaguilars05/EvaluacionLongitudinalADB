{% extends "base.html" %}

{% block title %}Actualizar Terapeuta - Gestión Clínica{% endblock %}

{% block content %}
<div class="contenedor">
    <h1>Editar Datos del Terapeuta</h1>
    <form action="{{ url_for('actualizar_terapeuta') }}" method="POST" style="margin-top: 1.5rem;">
        <input type="hidden" name="id_terapeuta" value="{{ Terapeuta[0] }}">

        <div class="grupo-form">
            <label for="nombres">Nombres:</label>
            <input id="nombres" type="text" name="nombres" value="{{ Terapeuta[1] }}" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_paterno">Apellido Paterno:</label>
            <input id="apellido_paterno" type="text" name="apellido_paterno" value="{{ Terapeuta[2] }}" required>
        </div>
        <div class="grupo-form">
            <label for="apellido_materno">Apellido Materno:</label>
            <input id="apellido_materno" type="text" name="apellido_materno" value="{{ Terapeuta[3] or '' }}">
        </div>
        <div class="grupo-form">
            <label for="cedula_profesional">Cédula Profesional:</label>
            <input id="cedula_profesional" type="text" name="cedula_profesional" value="{{ Terapeuta[4] }}" required>
        </div>
        <button type="submit" class="btn btn-primario">Actualizar Cambios</button>
        <a href="{{ url_for('terapeutas') }}" class="btn" style="background-color: #e2e8f0; color: #334155; margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
